<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- On a page that cannot scroll, iOS Safari never paints content behind its
       bottom bar: it fills that strip with a colour taken from the page.
       viewport-fit=cover plus theme-color hand it the photograph's own bottom
       tone instead of blank white. The colour is the sampled bottom edge of
       hero.jpg; the script below re-samples it at load so a future hero photo
       stays in tune without touching this file. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#513320">
  <title>Andrés Quintero</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/style.css?v=8">
  <script src="js/debug.js?v=8"></script>
</head>
<body class="home">
  <main class="landing">
    <img class="hero" src="assets/hero.jpg" alt=""
         width="1920" height="1281" style="aspect-ratio: 1920 / 1281">
    <!-- iOS only (via CSS): the same photograph blurred, visible just at the
         top and bottom edges, so the image melts into Safari's bars -->
    <img class="hero-blur" src="assets/hero.jpg" alt="" aria-hidden="true"
         width="1920" height="1281">
    <div class="overlay">
      <nav class="menu">
        <a href="work.html">Work</a><span class="sep">&nbsp;/&nbsp;</span><a href="about.html">About</a>
      </nav>
      <h1 class="name"><a href="work.html">Andrés Quintero</a></h1>
    </div>
  </main>

  <script>
    // keep Safari's bar tint in tune with whatever the hero photograph is:
    // average the bottom tenth of the image and hand it to theme-color
    (function () {
      var img = document.querySelector('img.hero');
      function sample() {
        try {
          var c = document.createElement('canvas'); c.width = 40; c.height = 8;
          var x = c.getContext('2d');
          x.drawImage(img, 0, img.naturalHeight * 0.9, img.naturalWidth, img.naturalHeight * 0.1, 0, 0, 40, 8);
          var d = x.getImageData(0, 0, 40, 8).data, r = 0, g = 0, b = 0, n = d.length / 4;
          for (var i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
          function h(v) { return Math.round(v / n).toString(16).padStart(2, '0'); }
          var tone = '#' + h(r) + h(g) + h(b);
          document.querySelector('meta[name="theme-color"]').content = tone;
          document.body.style.backgroundColor = tone;
        } catch (e) { /* leave the static colour */ }
      }
      if (img.complete && img.naturalWidth) sample(); else img.addEventListener('load', sample);
    })();
  </script>
</body>
</html>
