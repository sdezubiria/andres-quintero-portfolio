<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work — Andrés Quintero</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/photos.js"></script>
  <script src="js/lightbox.js"></script>
</head>
<body>
  <header class="nav">
    <a class="brand serif" href="index.html">Andrés Quintero</a>
    <nav class="links category">
      <a href="work.html" class="active">Work</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="work">
    <aside class="projects">
      <ul id="project-list"></ul>
    </aside>

    <section class="gallery">
      <div class="main-wrap fit-wrap"></div>
      <p class="x-swipe-hint" aria-hidden="true">‹ swipe ›</p>
      <div class="thumbs" id="thumbs"></div>
      <!-- the two halves that displace the series -->
      <div class="x-nav x-prev" aria-hidden="true"></div>
      <div class="x-nav x-next" aria-hidden="true"></div>
    </section>
  </main>

  <!-- one cover per project, very subtle -->
  <button class="x-sheet-btn" type="button">Thumbnails</button>

  <script>
    // The real projects, generated from the photo folders by tools/build-photos.sh.
    // Each photo carries its own pixel size [w, h] so scaling never distorts it.
    var PROJECTS = window.AQ_PROJECTS || [];

    // Where each photo lives: assets/img/<slug>/01.jpg and its 520px thumbnail.
    function srcOf(p, k) { return 'assets/img/' + p.slug + '/' + pad(k + 1) + '.jpg'; }
    function thumbOf(p, k) { return 'assets/img/' + p.slug + '/' + pad(k + 1) + '-t.jpg'; }
    function pad(n) { return n < 10 ? '0' + n : String(n); }

    // The whole project in the shape the lightbox understands, so it can be
    // walked photo by photo (arrows, scroll, thumbnail sheet).
    function galleryOf(p) {
      return p.photos.map(function (ratio, k) {
        return {
          ratio: ratio[0] / ratio[1],
          src: srcOf(p, k),
          thumb: thumbOf(p, k),
          caption: p.name + ' — ' + (k + 1) + ' / ' + p.photos.length
        };
      });
    }

    // A photograph, sized by its own intrinsic proportions (width/height are the
    // real pixel dimensions), so the browser letterboxes it without ever cropping.
    function photoImg(p, k, big) {
      var ratio = p.photos[k];
      var img = document.createElement('img');
      img.className = 'ph photo';
      img.alt = '';
      img.decoding = 'async';
      img.width = ratio[0];
      img.height = ratio[1];
      // holds the frame open while the file is still on its way
      img.style.aspectRatio = ratio[0] + ' / ' + ratio[1];
      img.src = big ? srcOf(p, k) : thumbOf(p, k);
      return img;
    }

    var list = document.getElementById('project-list');
    var thumbs = document.getElementById('thumbs');
    var mainWrap = document.querySelector('.main-wrap');
    var workMain = document.querySelector('main.work');
    var sheetBtn = document.querySelector('.x-sheet-btn');

    PROJECTS.forEach(function (p, i) {
      var li = document.createElement('li');
      li.innerHTML = '<span class="project-name"></span>';
      li.querySelector('.project-name').textContent = p.name;
      li.addEventListener('click', function () { xJumpProject(i); });
      // hovering a title shows that project's opening image in the viewer;
      // leaving restores the slide the visitor was on
      li.addEventListener('mouseenter', function () { renderSlide(xSlides[xProjSlide[i]]); });
      li.addEventListener('mouseleave', function () { renderSlide(xSlides[xIndex]); });
      list.appendChild(li);
    });

    // One photograph at a time — two verticals of the same project hang side
    // by side as a diptych (ref. emmanuelsmonsalve.com).
    var xSlides = [];      // each slide: { proj, idxs: [k] or [k, k+1] }
    var xProjSlide = [];   // first slide of each project
    PROJECTS.forEach(function (p, i) {
      xProjSlide[i] = xSlides.length;
      var k = 0;
      while (k < p.photos.length) {
        var a = p.photos[k], b = p.photos[k + 1];
        if (b && a[0] < a[1] && b[0] < b[1]) {   // two verticals → one diptych
          xSlides.push({ proj: i, idxs: [k, k + 1] });
          k += 2;
        } else {
          xSlides.push({ proj: i, idxs: [k] });
          k += 1;
        }
      }
    });
    var xIndex = 0;

    // the titles bar shows only a few projects; «Show more» reveals the rest
    var X_SHOWN = 6;
    var xExpanded = false;
    var moreLi = document.createElement('li');
    moreLi.className = 'x-more';
    moreLi.innerHTML = '<span class="project-name">Show more</span>';
    moreLi.addEventListener('click', function () {
      xExpanded = !xExpanded;
      xApplyTitles();
    });
    list.appendChild(moreLi);
    function xApplyTitles() {
      moreLi.querySelector('.project-name').textContent = xExpanded ? 'Show less' : 'Show more';
      var current = xSlides[xIndex].proj;
      list.querySelectorAll('li').forEach(function (li, j) {
        if (li === moreLi) return;
        // the current project stays visible even when the bar is folded
        li.classList.toggle('x-hidden', !xExpanded && j >= X_SHOWN && j !== current);
      });
    }

    // crossing a project's edge in the lightbox slides into the neighbour
    // project — the handler renews itself with the project it lands on
    function lbBoundaryFor(pi) {
      return function (d) {
        var np = (pi + (d > 0 ? 1 : -1) + PROJECTS.length) % PROJECTS.length;
        return {
          photos: galleryOf(PROJECTS[np]),
          index: d > 0 ? 0 : PROJECTS[np].photos.length - 1,
          onBoundary: lbBoundaryFor(np)
        };
      };
    }

    // puts one slide in the viewer — used by the series itself and by the
    // hover previews on the project titles
    function renderSlide(sl) {
      var p = PROJECTS[sl.proj];
      mainWrap.innerHTML = '';
      mainWrap.classList.toggle('pair', sl.idxs.length === 2);
      sl.idxs.forEach(function (k) {
        var img = photoImg(p, k, true);
        // what the cursor tip reads over this print, e.g. "2/6"
        img.dataset.num = (k + 1) + '/' + p.photos.length;
        // inside the print: a zoomable lightbox that can still walk the
        // whole archive; outside it, the halves navigate
        img.addEventListener('click', function () {
          AQ.openLightbox({ photos: galleryOf(p), index: k, onBoundary: lbBoundaryFor(sl.proj) });
        });
        mainWrap.appendChild(img);
      });
    }

    function xRender() {
      var sl = xSlides[xIndex];
      renderSlide(sl);
      // the project name lives only in the titles bar (and in the lightbox)
      list.querySelectorAll('li').forEach(function (li, j) {
        li.classList.toggle('active', j === sl.proj);
      });
      xApplyTitles();
      // the neighbours load quietly while this slide is on screen
      [1, -1].forEach(function (d) {
        var n = xSlides[(xIndex + d + xSlides.length) % xSlides.length];
        n.idxs.forEach(function (k) { (new Image()).src = srcOf(PROJECTS[n.proj], k); });
      });
    }
    function xGo(d) {
      xIndex = (xIndex + d + xSlides.length) % xSlides.length;
      // once the visitor has moved through the series the reminder retires
      var hint = document.querySelector('.x-swipe-hint');
      if (hint) hint.style.opacity = '0';
      xRender();
    }
    function xJumpProject(i) {
      xIndex = xProjSlide[i];
      xExpanded = false;
      xSetGrid(false);
      xRender();
    }
    function xSetGrid(on) {
      workMain.classList.toggle('x-grid', on);
      sheetBtn.textContent = on ? 'Close' : 'Thumbnails';
    }

    // the sheet: one cover per project
    PROJECTS.forEach(function (p, i) {
      var cell = document.createElement('div');
      cell.className = 'cell fit-wrap';
      cell.dataset.caption = p.name;
      cell.appendChild(photoImg(p, 0, false));
      cell.addEventListener('click', function () { xJumpProject(i); });
      thumbs.appendChild(cell);
    });

    // the photo number rides beside the cursor while it is on the photograph;
    // it reads the print under it and turns white over the dark passages
    var tip = document.createElement('div');
    tip.className = 'cursor-tip';
    document.body.appendChild(tip);
    var sampler = document.createElement('canvas');
    sampler.width = sampler.height = 6;
    var sctx = sampler.getContext('2d', { willReadFrequently: true });
    function darkUnder(img, x, y) {
      if (!img.naturalWidth) return false;
      var r = img.getBoundingClientRect();
      var scale = img.naturalWidth / r.width;
      // a patch about 30 display px wide where the text sits, kept inside the print
      var s = 30 * scale;
      var sx = Math.min(Math.max((x - r.x) * scale - s / 2, 0), img.naturalWidth - s);
      var sy = Math.min(Math.max((y - r.y) * scale - s / 2, 0), img.naturalHeight - s);
      try {
        sctx.drawImage(img, sx, sy, s, s, 0, 0, 6, 6);
        var d = sctx.getImageData(0, 0, 6, 6).data, lum = 0;
        for (var i = 0; i < d.length; i += 4) lum += 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
        return lum / (d.length / 4) < 128;
      } catch (err) { return false; }
    }
    mainWrap.addEventListener('mousemove', function (e) {
      if (e.target.classList && e.target.classList.contains('photo')) {
        tip.textContent = e.target.dataset.num || '';
        tip.style.left = (e.clientX + 16) + 'px';
        tip.style.top = (e.clientY + 12) + 'px';
        tip.style.color = darkUnder(e.target, e.clientX + 16, e.clientY + 12) ? '#fff' : '';
        tip.style.display = 'block';
      } else {
        tip.style.display = 'none';
      }
    });
    mainWrap.addEventListener('mouseleave', function () { tip.style.display = 'none'; });

    document.querySelector('.x-prev').addEventListener('click', function () { xGo(-1); });
    document.querySelector('.x-next').addEventListener('click', function () { xGo(1); });
    sheetBtn.addEventListener('click', function () {
      xSetGrid(!workMain.classList.contains('x-grid'));
    });
    document.addEventListener('keydown', function (e) {
      if (document.body.classList.contains('lb-open') || workMain.classList.contains('x-grid')) return;
      if (e.key === 'ArrowRight') xGo(1);
      else if (e.key === 'ArrowLeft') xGo(-1);
    });
    var xWheelAt = 0;
    document.querySelector('.gallery').addEventListener('wheel', function (e) {
      if (workMain.classList.contains('x-grid')) return;
      e.preventDefault();
      // dominant axis: a horizontal trackpad swipe displaces the series too
      var delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      var now = Date.now();
      if (now - xWheelAt < 350 || Math.abs(delta) < 8) return;
      xWheelAt = now;
      xGo(delta > 0 ? 1 : -1);
    }, { passive: false });
    // a swipe on a touch screen displaces the series too
    var xTouchX = null;
    document.querySelector('.gallery').addEventListener('touchstart', function (e) {
      xTouchX = e.touches[0].clientX;
    }, { passive: true });
    document.querySelector('.gallery').addEventListener('touchend', function (e) {
      if (xTouchX === null) return;
      var dx = e.changedTouches[0].clientX - xTouchX;
      xTouchX = null;
      if (Math.abs(dx) > 40) xGo(dx < 0 ? 1 : -1);
    });

    xSetGrid(false);
    xRender();

    // each project's opening image loads quietly once the page is idle, so
    // the hover previews on the titles appear without a blank beat
    window.addEventListener('load', function () {
      var i = 0;
      function next() {
        if (i >= PROJECTS.length) return;
        var img = new Image();
        img.onload = img.onerror = next;
        img.src = srcOf(PROJECTS[i++], 0);
      }
      next();
    });
  </script>
</body>
</html>
