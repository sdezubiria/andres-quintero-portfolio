<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work — Andrés Quintero</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/photos.js"></script>
  <script src="js/versions.js"></script>
</head>
<body>
  <header class="nav">
    <a class="brand serif" href="index.html">Andrés Quintero</a>
    <nav class="links category">
      <a href="work.html" class="active">Work</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="work">
    <aside class="projects">
      <ul id="project-list"></ul>
    </aside>

    <section class="gallery">
      <div class="main-wrap fit-wrap"></div>
      <div class="side-wrap fit-wrap"></div>
      <div class="thumbs" id="thumbs"></div>
      <p class="caption category" id="caption"></p>
    </section>
  </main>

  <script>
    // The real projects, generated from the photo folders by tools/build-photos.sh.
    // Each photo carries its own pixel size [w, h] so scaling never distorts it.
    var PROJECTS = window.AQ_PROJECTS || [];

    // Where each photo lives: assets/img/<slug>/01.jpg and its 520px thumbnail.
    function srcOf(p, k) { return 'assets/img/' + p.slug + '/' + pad(k + 1) + '.jpg'; }
    function thumbOf(p, k) { return 'assets/img/' + p.slug + '/' + pad(k + 1) + '-t.jpg'; }
    function pad(n) { return n < 10 ? '0' + n : String(n); }

    // A photograph, sized by its own intrinsic proportions (width/height are the
    // real pixel dimensions), so the browser letterboxes it without ever cropping.
    function photoImg(p, k, big) {
      var ratio = p.photos[k];
      var img = document.createElement('img');
      img.className = 'ph photo';
      img.alt = '';
      img.decoding = 'async';
      img.width = ratio[0];
      img.height = ratio[1];
      // holds the frame open while the file is still on its way
      img.style.aspectRatio = ratio[0] + ' / ' + ratio[1];
      img.src = big ? srcOf(p, k) : thumbOf(p, k);
      return img;
    }

    var list = document.getElementById('project-list');
    var thumbs = document.getElementById('thumbs');
    var caption = document.getElementById('caption');
    var mainWrap = document.querySelector('.main-wrap');
    var sideWrap = document.querySelector('.side-wrap');
    var activeProject = 0, activePhoto = 0;

    PROJECTS.forEach(function (p, i) {
      var li = document.createElement('li');
      li.innerHTML = '<span class="project-name"></span>' +
        '<div class="meta category">' + p.photos.length + ' fotografías</div>';
      li.querySelector('.project-name').textContent = p.name;
      li.addEventListener('click', function () {
        selectProject(i);
        window.scrollTo({ top: 0 });   // a new project starts at its first photo
      });
      list.appendChild(li);
    });

    function captionFor(k) {
      return PROJECTS[activeProject].name + ' — ' + (k + 1) + ' / ' + PROJECTS[activeProject].photos.length;
    }

    function selectProject(i) {
      activeProject = i;
      list.querySelectorAll('li').forEach(function (li, j) {
        li.classList.toggle('active', j === i);
      });
      thumbs.innerHTML = '';
      var p = PROJECTS[i];
      p.photos.forEach(function (ratio, k) {
        var cell = document.createElement('div');
        cell.className = 'cell fit-wrap';
        cell.dataset.caption = p.name + ' ' + (k + 1);
        cell.appendChild(photoImg(p, k, false));
        cell.addEventListener('click', function () {
          // only A has a big view to feed; elsewhere the sheet is the layout
          if (document.body.dataset.v === 'a') {
            selectPhoto(k);
          } else {
            AQ.openLightbox({ ratio: ratio[0] / ratio[1], caption: captionFor(k), src: srcOf(p, k) });
          }
        });
        thumbs.appendChild(cell);
      });
      selectPhoto(0);
    }

    function selectPhoto(k) {
      activePhoto = k;
      var p = PROJECTS[activeProject];
      mainWrap.innerHTML = '';
      mainWrap.appendChild(photoImg(p, k, true));
      // B shows a second photo of the project as an editorial spread
      sideWrap.innerHTML = '';
      sideWrap.appendChild(photoImg(p, (k + 1) % p.photos.length, true));
      thumbs.querySelectorAll('.cell').forEach(function (t, j) {
        t.classList.toggle('active', j === k);
      });
      caption.textContent = captionFor(k);
    }

    mainWrap.addEventListener('click', function () {
      var p = PROJECTS[activeProject], r = p.photos[activePhoto];
      AQ.openLightbox({ ratio: r[0] / r[1], caption: captionFor(activePhoto), src: srcOf(p, activePhoto) });
    });
    sideWrap.addEventListener('click', function () {
      var p = PROJECTS[activeProject];
      var k = (activePhoto + 1) % p.photos.length;
      AQ.openLightbox({ ratio: p.photos[k][0] / p.photos[k][1], caption: captionFor(k), src: srcOf(p, k) });
    });

    // ————— Version D: one justified wall of every photo (VSCO / are.na) —————
    // Photos are packed into rows until a row is about as tall as TARGET_ROW,
    // then the row is stretched to the exact page width. Every photo keeps its
    // proportions exactly; the wall is as tall as it needs to be and scrolls.
    var ALL = [];
    PROJECTS.forEach(function (p) {
      p.photos.forEach(function (ratio, k) {
        ALL.push({
          ratio: ratio,
          src: srcOf(p, k),
          thumb: thumbOf(p, k),
          caption: p.name + ' — ' + (k + 1) + ' / ' + p.photos.length
        });
      });
    });

    function buildWall() {
      thumbs.innerHTML = '';
      var GAP = 8;
      var W = thumbs.clientWidth;
      if (!W) return;
      var TARGET_ROW = Math.max(180, Math.min(340, innerHeight * 0.30));
      var ratios = ALL.map(function (ph) { return ph.ratio[0] / ph.ratio[1]; });

      // fill a row until it would be shorter than TARGET_ROW, then close it
      var rows = [], row = [], sum = 0;
      ratios.forEach(function (r, i) {
        row.push(i); sum += r;
        if ((W - GAP * (row.length - 1)) / sum <= TARGET_ROW) { rows.push(row); row = []; sum = 0; }
      });
      if (row.length) rows.push(row);

      rows.forEach(function (r, ri) {
        var div = document.createElement('div');
        div.className = 'grid-row';
        var s = r.reduce(function (acc, i) { return acc + ratios[i]; }, 0);
        // a full row is justified to the page width; a short last row keeps
        // the target height instead of blowing its few photos up
        var h = ri === rows.length - 1 && (W - GAP * (r.length - 1)) / s > TARGET_ROW
          ? TARGET_ROW
          : (W - GAP * (r.length - 1)) / s;
        r.forEach(function (i) {
          var img = document.createElement('img');
          img.className = 'ph photo';
          img.alt = '';
          img.loading = 'lazy';
          img.decoding = 'async';
          img.src = ALL[i].thumb;
          img.style.height = Math.floor(h) + 'px';
          img.style.width = Math.floor(h * ratios[i]) + 'px';
          img.title = ALL[i].caption;
          img.addEventListener('click', function () {
            AQ.openLightbox({ ratio: ratios[i], caption: ALL[i].caption, src: ALL[i].src });
          });
          div.appendChild(img);
        });
        thumbs.appendChild(div);
      });
      caption.textContent = ALL.length + ' fotografías';
    }

    function render() {
      if (document.body.dataset.v === 'd') buildWall();
      else selectProject(activeProject);
      window.scrollTo(0, 0);
    }
    document.addEventListener('aq:version', render);

    var resizeTimer;
    window.addEventListener('resize', function () {
      if (document.body.dataset.v !== 'd') return;
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(buildWall, 120);
    });

    selectProject(0);
  </script>
</body>
</html>
