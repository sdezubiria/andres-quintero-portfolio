<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work — Andrés Quintero</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/versions.js"></script>
</head>
<body>
  <header class="nav">
    <a class="brand serif" href="index.html">Andrés Quintero</a>
    <nav class="links category">
      <a href="work.html" class="active">Work</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main class="work">
    <aside class="projects">
      <ul id="project-list"></ul>
    </aside>

    <section class="gallery">
      <div class="main-wrap fit-wrap"></div>
      <div class="side-wrap fit-wrap"></div>
      <div class="thumbs" id="thumbs"></div>
      <p class="caption category" id="caption"></p>
    </section>
  </main>

  <script>
    // Sample projects — replace with real ones. Each photo carries its own
    // aspect ratio [w, h] so scaling never distorts it.
    var PROJECTS = [
      { name: 'Olivos',   year: '2025', photos: [[3,2],[4,5],[3,2],[1,1],[16,10],[4,5]] },
      { name: 'Marea',    year: '2024', photos: [[16,10],[3,2],[4,5],[3,2]] },
      { name: 'Cobre',    year: '2024', photos: [[4,5],[4,5],[3,2],[1,1],[3,2]] },
      { name: 'Jazmín',   year: '2023', photos: [[1,1],[3,2],[4,5],[16,10]] },
      { name: 'Silencio', year: '2022', photos: [[3,2],[4,5],[1,1],[3,2],[4,5],[3,2],[16,10]] }
    ];

    // Transparent SVG with the photo's proportions — behaves like a real image file.
    function phImg(ratio, big) {
      var s = big ? 300 : 100;
      var img = document.createElement('img');
      img.className = 'ph';
      img.alt = '';
      img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="' + ratio[0] * s + '" height="' + ratio[1] * s + '"></svg>'
      );
      return img;
    }

    var list = document.getElementById('project-list');
    var thumbs = document.getElementById('thumbs');
    var caption = document.getElementById('caption');
    var mainWrap = document.querySelector('.main-wrap');
    var sideWrap = document.querySelector('.side-wrap');
    var activeProject = 0, activePhoto = 0;

    PROJECTS.forEach(function (p, i) {
      var li = document.createElement('li');
      li.innerHTML = '<span class="project-name">' + p.name + '</span>' +
        '<div class="meta category">' + p.year + ' — ' + p.photos.length + ' fotografías</div>';
      li.addEventListener('click', function () { selectProject(i); });
      list.appendChild(li);
    });

    function captionFor(k) {
      return PROJECTS[activeProject].name + ' — ' + (k + 1) + ' / ' + PROJECTS[activeProject].photos.length;
    }

    function selectProject(i) {
      activeProject = i;
      list.querySelectorAll('li').forEach(function (li, j) {
        li.classList.toggle('active', j === i);
      });
      thumbs.innerHTML = '';
      PROJECTS[i].photos.forEach(function (ratio, k) {
        var cell = document.createElement('div');
        cell.className = 'cell fit-wrap';
        cell.dataset.caption = PROJECTS[i].name + ' ' + (k + 1);
        cell.appendChild(phImg(ratio, false));
        cell.addEventListener('click', function () {
          if (document.body.dataset.v === 'c') {
            AQ.openLightbox({ ratio: ratio[0] / ratio[1], caption: captionFor(k) });
          } else {
            selectPhoto(k);
          }
        });
        thumbs.appendChild(cell);
      });
      selectPhoto(0);
    }

    function selectPhoto(k) {
      activePhoto = k;
      var p = PROJECTS[activeProject];
      var ratio = p.photos[k];
      mainWrap.innerHTML = '';
      mainWrap.appendChild(phImg(ratio, true));
      // B shows a second photo of the project as an editorial spread
      var next = p.photos[(k + 1) % p.photos.length];
      sideWrap.innerHTML = '';
      sideWrap.appendChild(phImg(next, true));
      thumbs.querySelectorAll('.cell').forEach(function (t, j) {
        t.classList.toggle('active', j === k);
      });
      caption.textContent = captionFor(k);
    }

    mainWrap.addEventListener('click', function () {
      var r = PROJECTS[activeProject].photos[activePhoto];
      AQ.openLightbox({ ratio: r[0] / r[1], caption: captionFor(activePhoto) });
    });
    sideWrap.addEventListener('click', function () {
      var p = PROJECTS[activeProject];
      var k = (activePhoto + 1) % p.photos.length;
      AQ.openLightbox({ ratio: p.photos[k][0] / p.photos[k][1], caption: captionFor(k) });
    });

    selectProject(0);
  </script>
</body>
</html>
